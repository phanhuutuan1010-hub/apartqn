<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap"><script src="apartqn-data.js"></script></helmet>
<header ref="{{ rootRef }}" style="position:sticky;top:0;z-index:40;background:#FFFFFF;border-bottom:1px solid #E3E6EB;font-family:'Noto Sans',system-ui,sans-serif;color:#141821">
  <div style="max-width:1200px;margin:0 auto;padding:0 {{ L.px }};height:{{ hH }};display:flex;align-items:center;gap:16px">
    <a href="{{ homeHref }}" style="flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;gap:3px;min-height:44px;text-decoration:none">
      <span style="font-size:{{ wm }};line-height:1;letter-spacing:-0.035em;color:#0039A6;white-space:nowrap"><span style="font-weight:800">Apart</span><span style="font-weight:500">QN</span></span>
      <sc-if value="{{ showTag }}" hint-placeholder-val="{{ true }}"><span style="font-size:12px;line-height:1.3;color:#687080;white-space:nowrap">{{ tagline }}</span></sc-if>
    </a>
    <sc-if value="{{ L.lg }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;flex-wrap:nowrap;gap:4px;margin-left:24px;min-width:0">
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="3"><a href="{{ n.href }}" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:8px;font-size:15px;font-weight:{{ n.fw }};color:{{ n.fg }};text-decoration:none;white-space:nowrap" style-hover="background:#F1F3F6;color:#0039A6">{{ n.label }}</a></sc-for>
      </nav>
    </sc-if>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto">
      <div ref="{{ langRef }}" style="position:relative">
        <button onClick="{{ toggleLang }}" aria-haspopup="listbox" aria-expanded="{{ langOpen }}" style="height:44px;min-width:64px;padding:0 12px;border:1px solid #C9CED6;border-radius:10px;background:#FFFFFF;font:inherit;font-size:14px;font-weight:700;letter-spacing:.04em;color:#141821;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap" style-hover="border-color:#0039A6">{{ curCode }}<span style="font-size:10px;color:#687080">▾</span></button>
        <sc-if value="{{ langOpen }}">
          <div role="listbox" style="position:absolute;right:0;top:calc(100% + 6px);z-index:60;min-width:184px;padding:6px;background:#FFFFFF;border:1px solid #E3E6EB;border-radius:12px;box-shadow:0 12px 32px rgba(16,24,40,.16);display:flex;flex-direction:column;gap:2px">
            <sc-for list="{{ langs }}" as="g" hint-placeholder-count="3">
              <button role="option" onClick="{{ g.on }}" style="min-height:44px;padding:0 12px;border:0;border-radius:8px;background:{{ g.bg }};font:inherit;font-size:15px;color:#141821;cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left;white-space:nowrap" style-hover="background:#F1F3F6">
                <span style="width:26px;font-size:13px;font-weight:700;letter-spacing:.04em;color:{{ g.fg }}">{{ g.code }}</span><span style="flex:1">{{ g.name }}</span><span style="color:#0039A6;font-weight:700">{{ g.mark }}</span>
              </button>
            </sc-for>
          </div>
        </sc-if>
      </div>
      <sc-if value="{{ L.lg }}" hint-placeholder-val="{{ true }}">
        <a href="{{ consignHref }}" style="height:44px;padding:0 16px;display:flex;align-items:center;box-sizing:border-box;border:1.5px solid #0039A6;border-radius:10px;background:#FFFFFF;color:#0039A6;font-size:15px;font-weight:700;text-decoration:none;white-space:nowrap" style-hover="background:#EEF3FC;color:#0039A6">{{ consignLabel }}</a>
      </sc-if>
      <sc-if value="{{ L.ltLg }}">
        <button onClick="{{ openMenu }}" aria-label="{{ menuLabel }}" style="width:44px;height:44px;border:1px solid #E3E6EB;border-radius:10px;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:0">
          <span style="width:18px;height:2px;border-radius:1px;background:#141821"></span><span style="width:18px;height:2px;border-radius:1px;background:#141821"></span><span style="width:18px;height:2px;border-radius:1px;background:#141821"></span>
        </button>
      </sc-if>
    </div>
  </div>
  <sc-if value="{{ menuOpen }}">
    <div role="dialog" aria-label="{{ menuLabel }}" style="position:absolute;top:0;left:0;right:0;height:100vh;z-index:100;background:#FFFFFF;display:flex;flex-direction:column;overflow-y:auto">
      <div style="flex:0 0 auto;height:{{ hH }};padding:0 {{ L.px }};display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #E3E6EB">
        <span style="font-size:22px;line-height:1;letter-spacing:-0.035em;color:#0039A6"><span style="font-weight:800">Apart</span><span style="font-weight:500">QN</span></span>
        <button onClick="{{ closeMenu }}" aria-label="{{ closeLabel }}" style="width:44px;height:44px;border:0;border-radius:50%;background:#F1F3F6;font-size:22px;line-height:1;color:#141821;cursor:pointer">×</button>
      </div>
      <nav style="display:flex;flex-direction:column;padding:8px {{ L.px }} 0">
        <sc-for list="{{ nav }}" as="n"><a href="{{ n.href }}" onClick="{{ closeMenu }}" style="display:flex;align-items:center;min-height:48px;padding:4px 0;font-size:18px;font-weight:600;color:{{ n.fg }};text-decoration:none;border-bottom:1px solid #EEF0F3">{{ n.label }}</a></sc-for>
      </nav>
      <div style="display:flex;flex-direction:column;gap:12px;padding:20px {{ L.px }} 32px">
        <a href="{{ consignHref }}" style="height:52px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;border:1.5px solid #0039A6;border-radius:10px;color:#0039A6;font-size:16px;font-weight:700;text-decoration:none">{{ consignLabel }}</a>
        <span style="margin-top:12px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#687080">{{ contactLabel }}</span>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <sc-for list="{{ contacts }}" as="c" hint-placeholder-count="2"><a href="{{ c.href }}" target="_blank" style="height:48px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;border-radius:10px;border:1.5px solid #0039A6;background:{{ c.bg }};color:{{ c.fg }};font-size:15px;font-weight:700;text-decoration:none">{{ c.label }}</a></sc-for>
        </div>
        <span style="font-size:14px;color:#687080">{{ hours }}</span>
      </div>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:80},&quot;locale&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;vi&quot;,&quot;en&quot;,&quot;ru&quot;],&quot;default&quot;:&quot;vi&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;results&quot;,&quot;building&quot;,&quot;consign&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;menuOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;langOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onLocale&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(l: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { menu: !!this.props.menuOpen, lang: !!this.props.langOpen, loc: null, w: null };
  _measure = () => { const el = this._el; if (!el) return; const w = Math.round(el.getBoundingClientRect().width); if (w && w !== this.state.w) this.setState({ w }); };
  rootRef = (el) => { if (!el || el === this._el) return; this._ro && this._ro.disconnect(); this._el = el; this._measure(); requestAnimationFrame(this._measure); if (!this._rs) { this._rs = true; window.addEventListener('resize', this._measure); } try { this._ro = new ResizeObserver(this._measure); this._ro.observe(el); } catch (_) {} };
  langRef = React.createRef();
  componentDidMount() {
    if (!window.AQN) this._p = setInterval(() => { if (window.AQN) { clearInterval(this._p); this.forceUpdate(); } }, 40);
    this._watch();
    this._doc = (e) => { if (this.state.lang && this.langRef.current && !this.langRef.current.contains(e.target)) this.setState({ lang: false }); };
    document.addEventListener('pointerdown', this._doc);
  }
  componentDidUpdate() { this._watch(); }
  componentWillUnmount() { window.removeEventListener('resize', this._measure); clearInterval(this._p); this._ro && this._ro.disconnect(); document.removeEventListener('pointerdown', this._doc); }
  _watch() {
    const el = this._el; if (!el || this._ro) return;
    this._ro = new ResizeObserver((es) => { const w = Math.round(es[0].contentRect.width); if (w && w !== this.state.w) this.setState({ w }); });
    this._ro.observe(el);
  }
  renderVals() {
    const A = window.AQN; if (!A) return {};
    const l = this.props.onLocale ? (this.props.locale || 'vi') : (this.state.loc || this.props.locale || 'vi');
    const w = this.state.w || (this.props.mobile ? 390 : A.initW(this.props)), L = A.layout(w);
    const set = (x) => () => { this.setState({ lang: false }); this.props.onLocale ? this.props.onLocale(x) : this.setState({ loc: x }); };
    const act = this.props.active;
    return {
      rootRef: this.rootRef, langRef: this.langRef, L, hH: L.hdr + 'px', wm: L.lg ? '24px' : '22px', showTag: !L.xs,
      tagline: A.t('tagline', l), homeHref: A.link('home', {}, l), consignHref: A.link('consign', {}, l), consignLabel: A.t('navConsign', l),
      nav: A.navLinks(l).filter((n) => n.k !== 'consign').map((n) => Object.assign(n, { fg: n.k === act ? '#0039A6' : '#3A404C', fw: n.k === act ? 700 : 500 })),
      curCode: l.toUpperCase(), langOpen: this.state.lang, toggleLang: () => this.setState((s) => ({ lang: !s.lang })),
      langs: A.LOCS.map((x) => ({ code: x.toUpperCase(), name: A.t('langName_' + x, l), on: set(x), bg: x === l ? '#EEF3FC' : 'transparent', fg: x === l ? '#0039A6' : '#687080', mark: x === l ? '✓' : '' })),
      menuOpen: L.ltLg && this.state.menu, openMenu: () => this.setState({ menu: true, lang: false }), closeMenu: () => this.setState({ menu: false }),
      menuLabel: A.t('menu', l), closeLabel: A.t('close', l), contactLabel: A.t('navContact', l), hours: A.t('fHours', l),
      contacts: A.contacts(null, l, A.F.msgG(l)).map((c, i) => Object.assign({}, c, { bg: i === 0 ? '#0039A6' : '#FFFFFF', fg: i === 0 ? '#FFFFFF' : '#0039A6' }))
    };
  }
}
</script>
</body>
</html>
