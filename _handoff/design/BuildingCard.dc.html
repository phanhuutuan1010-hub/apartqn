<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap"><script src="apartqn-data.js"></script></helmet>
<a href="{{ href }}" style="display:flex;flex-direction:column;gap:10px;text-decoration:none;color:#141821;font-family:'Noto Sans',system-ui,sans-serif;min-width:0">
  <div style="position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:repeating-linear-gradient(135deg,#E3E9F3 0 12px,#EEF2F8 12px 24px);box-shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06)">
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px"><span style="font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#5A6272;background:rgba(255,255,255,.88);padding:4px 8px;border-radius:6px;text-align:center">building facade</span></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:3px;padding:0 2px">
    <div style="font-size:15px;font-weight:700;line-height:1.3;text-wrap:pretty">{{ name }}</div>
    <div style="font-size:13px;color:#687080">{{ addr }}</div>
    <div style="font-size:13px;font-weight:600;color:#0039A6;margin-top:2px">{{ units }}</div>
    <div style="font-size:13px;color:#3A404C">{{ fromLine }}</div>
  </div>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:280,&quot;height&quot;:320},&quot;locale&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;vi&quot;,&quot;en&quot;,&quot;ru&quot;],&quot;default&quot;:&quot;vi&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;id&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;altara&quot;,&quot;phutai&quot;,&quot;flc&quot;,&quot;tms&quot;,&quot;hagl&quot;,&quot;apt&quot;,&quot;thinhphat&quot;,&quot;ecolife&quot;],&quot;default&quot;:&quot;altara&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  componentDidMount() { if (!window.AQN) this._p = setInterval(() => { if (window.AQN) { clearInterval(this._p); this.forceUpdate(); } }, 40); }
  componentWillUnmount() { clearInterval(this._p); }
  renderVals() {
    const A = window.AQN; if (!A) return {};
    const l = this.props.locale || 'vi', b = A.building(this.props.id || 'altara');
    const ls = A.L.filter((x) => x.b === b.id && x.status !== 'rented');
    const min = ls.length ? Math.min(...ls.map((x) => x.rent)) : 0;
    return {
      href: A.link('building', { id: b.id }, l), name: b.name, addr: b.street + ' · ' + A.t('ward', l),
      units: A.F.units(ls.length, l),
      fromLine: min ? A.t('from', l) + ' ' + A.mil(min, l) + A.t('perMonth', l) : ''
    };
  }
}
</script>
</body>
</html>
