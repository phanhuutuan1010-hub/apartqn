<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap"><script src="apartqn-data.js"></script></helmet>
<sc-if value="{{ done }}"><div style="display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:32px 24px;background:#FFFFFF;border:1px solid #E3E6EB;border-radius:16px;font-family:'Noto Sans',system-ui,sans-serif;color:#141821">
  <span style="width:48px;height:48px;border-radius:50%;background:#E6F4EC;color:#1E7F4F;font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center">✓</span>
  <span style="font-size:22px;font-weight:800;letter-spacing:-0.01em">{{ s.cfDone }}</span>
  <span style="font-size:15px;line-height:1.55;color:#3A404C">{{ s.cfDoneSub }}</span>
  <button onClick="{{ again }}" style="margin-top:4px;height:44px;padding:0 16px;border:1.5px solid #0039A6;border-radius:10px;background:#FFFFFF;color:#0039A6;font:inherit;font-size:15px;font-weight:700;cursor:pointer">{{ s.vrAgain }}</button>
</div></sc-if>
<sc-if value="{{ form }}" hint-placeholder-val="{{ true }}"><form onSubmit="{{ submit }}" style="display:flex;flex-direction:column;gap:20px;margin:0;padding:24px;background:#FFFFFF;border:1px solid #E3E6EB;border-radius:16px;box-shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);font-family:'Noto Sans',system-ui,sans-serif;color:#141821">
  <div style="display:flex;flex-direction:column;gap:4px">
    <span style="font-size:22px;font-weight:800;letter-spacing:-0.01em">{{ s.cfTitle }}</span>
    <span style="font-size:14px;color:#3A404C">{{ s.cfSub }}</span>
  </div>
  <div style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#687080">{{ s.cfUnit }}</div>
  <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#3A404C">{{ s.building }}
    <select value="{{ bsel }}" onChange="{{ onB }}" style="height:48px;padding:0 14px;border:1px solid #C9CED6;border-radius:10px;font:inherit;font-size:16px;font-weight:400;color:#141821;background:#FFFFFF;width:100%;box-sizing:border-box">
      <option value="">{{ s.selectPh }}</option>
      <sc-for list="{{ blds }}" as="b" hint-placeholder-count="8"><option value="{{ b.id }}">{{ b.name }}</option></sc-for>
    </select>
  </label>
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px">
    <sc-for list="{{ small }}" as="f" hint-placeholder-count="3">
      <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#3A404C">{{ f.label }}
        <input name="{{ f.name }}" inputMode="numeric" placeholder="{{ f.ph }}" style="height:48px;padding:0 14px;border:1px solid #C9CED6;border-radius:10px;font:inherit;font-size:16px;font-weight:400;color:#141821;background:#FFFFFF;width:100%;box-sizing:border-box" style-focus="border-color:#0039A6;box-shadow:0 0 0 3px #D9E4F7;outline:none"></input>
      </label>
    </sc-for>
  </div>
  <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#3A404C">{{ s.cfRent }}
    <input name="rent" required="{{ true }}" inputMode="numeric" placeholder="10.000.000" style="height:48px;padding:0 14px;border:1px solid #C9CED6;border-radius:10px;font:inherit;font-size:16px;font-weight:400;color:#141821;background:#FFFFFF;width:100%;box-sizing:border-box" style-focus="border-color:#0039A6;box-shadow:0 0 0 3px #D9E4F7;outline:none"></input>
  </label>
  <div style="display:flex;flex-direction:column;gap:6px">
    <span style="font-size:13px;font-weight:600;color:#3A404C">{{ s.cfPhotos }}</span>
    <label style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:24px 16px;border:1.5px dashed #8FA9DA;border-radius:12px;background:#F5F8FE;text-align:center;cursor:pointer" style-hover="background:#EEF3FC">
      <span style="width:40px;height:40px;border-radius:50%;background:#D9E4F7;color:#0039A6;font-size:22px;font-weight:600;display:flex;align-items:center;justify-content:center">+</span>
      <span style="font-size:14px;font-weight:600;color:#0039A6">{{ s.cfDrop }}</span>
      <span style="font-size:12px;color:#687080">{{ s.cfDropHint }}</span>
      <sc-if value="{{ hasFiles }}"><span style="font-size:13px;font-weight:600;color:#1E7F4F">✓ {{ filesLabel }}</span></sc-if>
      <input name="photos" type="file" multiple="{{ true }}" accept="image/*" onChange="{{ onFiles }}" style="display:none"></input>
    </label>
  </div>
  <div style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#687080;padding-top:4px">{{ s.cfContact }}</div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">
    <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#3A404C">{{ s.vrName }}
      <input name="owner" required="{{ true }}" placeholder="{{ s.vrNamePh }}" style="height:48px;padding:0 14px;border:1px solid #C9CED6;border-radius:10px;font:inherit;font-size:16px;font-weight:400;color:#141821;background:#FFFFFF;width:100%;box-sizing:border-box" style-focus="border-color:#0039A6;box-shadow:0 0 0 3px #D9E4F7;outline:none"></input>
    </label>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#3A404C">{{ s.vrPhone }}
      <input name="phone" required="{{ true }}" type="tel" placeholder="+84 9xx xxx xxx" style="height:48px;padding:0 14px;border:1px solid #C9CED6;border-radius:10px;font:inherit;font-size:16px;font-weight:400;color:#141821;background:#FFFFFF;width:100%;box-sizing:border-box" style-focus="border-color:#0039A6;box-shadow:0 0 0 3px #D9E4F7;outline:none"></input>
    </label>
  </div>
  <sc-if value="{{ err }}"><span style="font-size:13px;color:#B42318">{{ s.sendErr }}</span></sc-if>
  <button type="submit" disabled="{{ busy }}" style="height:52px;border:0;border-radius:10px;opacity:{{ busyOp }};background:#D52B1E;color:#FFFFFF;font:inherit;font-size:16px;font-weight:700;cursor:pointer" style-hover="background:#B82217" style-active="background:#9C1C12">{{ submitLabel }}</button>
</form></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:900},&quot;locale&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;vi&quot;,&quot;en&quot;,&quot;ru&quot;],&quot;default&quot;:&quot;vi&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { done: false, b: null, busy: false, err: false, files: 0 };
  componentDidMount() { if (!window.AQN) this._p = setInterval(() => { if (window.AQN) { clearInterval(this._p); this.forceUpdate(); } }, 40); }
  componentWillUnmount() { clearInterval(this._p); }
  renderVals() {
    const A = window.AQN; if (!A) return {};
    const l = this.props.locale || 'vi', s = {};
    ['cfTitle', 'cfSub', 'cfUnit', 'cfContact', 'cfRent', 'cfPhotos', 'cfDrop', 'cfDropHint', 'cfSubmit', 'building', 'selectPh', 'vrName', 'vrPhone', 'vrNamePh', 'cfDone', 'cfDoneSub', 'vrAgain', 'sendErr'].forEach((k) => (s[k] = A.t(k, l)));
    return {
      s, blds: A.B.map((b) => ({ id: b.id, name: b.name })),
      small: [{ name: 'floor', label: A.t('floor', l), ph: '12' }, { name: 'area', label: A.t('area', l) + ', ' + A.m2(l), ph: '65' }, { name: 'beds', label: A.t('bedrooms', l), ph: '2' }],
      hasFiles: this.state.files > 0, filesLabel: A.F.photos(this.state.files, l), onFiles: (e) => this.setState({ files: e.target.files ? e.target.files.length : 0 }),
      err: !!this.state.err, busy: !!this.state.busy, busyOp: this.state.busy ? 0.7 : 1, submitLabel: this.state.busy ? A.t('sending', l) : s.cfSubmit,
      done: !!this.state.done, form: !this.state.done, bsel: this.state.b ?? (this.props.building || ''), onB: (e) => this.setState({ b: e.target.value }),
      submit: (e) => {
        e.preventDefault(); if (this.state.busy) return;
        const fd = new FormData(e.currentTarget), g = (k) => (fd.get(k) || '').toString().trim() || '—';
        const bid = this.state.b ?? (this.props.building || ''), bn = bid ? A.building(bid).name : '—';
        this.setState({ busy: true, err: false });
        A.send('[ApartQN] Ký gửi căn hộ · ' + bn, { 'Loại': 'Ký gửi căn hộ', 'Toà nhà': bn, 'Tầng': g('floor'), 'Diện tích (m²)': g('area'), 'Phòng ngủ': g('beds'), 'Giá mong muốn (₫/tháng)': g('rent'), 'Số ảnh đã chọn': String(this.state.files || 0) + ' (ảnh sẽ nhận qua Zalo khi liên hệ lại)', 'Chủ nhà': g('owner'), 'Điện thoại': g('phone'), 'Ngôn ngữ': l.toUpperCase() })
          .then(() => this.setState({ busy: false, done: true, files: 0 }))
          .catch(() => this.setState({ busy: false, err: true }));
      }, again: () => this.setState({ done: false })
    };
  }
}
</script>
</body>
</html>
